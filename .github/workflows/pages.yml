# サイトを組み立てて GitHub Pages に公開する。
name: サイトの公開
on:
  push:
    branches: [main]
  # 裏の計算・シーズンの取り込みが保存した結果を公開し直す（Actions からの書き込みでは push の起動が起きないため）
  workflow_run:
    workflows: ['裏の計算', 'シーズンの取り込み']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: vendor/showdown
          key: showdown-${{ hashFiles('tools/showdown/COMMIT') }}
      - run: npm run showdown:setup
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
