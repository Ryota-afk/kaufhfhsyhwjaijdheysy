# 作業用の枝への push と PR で、テストと組み立てを確かめる。
name: テスト
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: vendor/showdown
          key: showdown-${{ hashFiles('tools/showdown/COMMIT') }}
      - run: npm run showdown:setup
      - run: npm test
      - run: npm run build
